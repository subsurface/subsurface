<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <title>Diver down flag map marker - gray</title>
  <g stroke-linejoin="round">
    <!-- mast -->
    <polygon points="7.7,2 10.2,2.6 5,30.8 1.8,30.2" fill="#000000"/>
    <!-- black flag outline -->
    <polygon points="8.2,6 24.9,10.2 21.6,23.8 5.4,19.6" fill="#000000"/>
    <!-- red flag face -->
    <polygon points="9.5,7.2 23.4,10.7 20.6,22.4 7.1,18.9" fill="#666666"/>
    <!-- white diagonal stripe -->
    <polygon points="10.7,8 14.2,8.9 19.2,21.3 15.7,20.4" fill="#E6E6E6"/>
  </g>
</svg>
