/*******************************************************
 * SPDX-License-Identifier: GPL-2.0
 * Subsurface-Mobile own Gradle build spec. Derived from
 * the one supplied by Qt.
 *******************************************************/
buildscript {
    repositories {
        mavenCentral()
	google()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
    }
}

allprojects {
    repositories {
        mavenCentral()
        maven { url = 'https://jitpack.io' }
	google()
    }
}

apply plugin: 'com.android.application'

def subsurfaceDebugBuild = project.findProperty("subsurfaceDebuggable")?.toBoolean() ?: false

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation 'com.github.mik3y:usb-serial-for-android:v3.10.0'
    implementation 'androidx.core:core:1.12.0'
}

android {
    /*******************************************************
     * The following variables:
     * - androidBuildToolsVersion,
     * - androidCompileSdkVersion
     * - qtAndroidDir - holds the path to qt android files
     *                  needed to build any Qt application
     *                  on Android.
     *
     * are defined in gradle.properties file. This file is
     * updated by QtCreator and androiddeployqt tools.
     * Changing them manually might break the compilation!
     *******************************************************/

    // androidCompileSdkVersion may be an integer ("35") or a platform
    // string ("android-36-ext19"); handle both forms
    if (androidCompileSdkVersion.isInteger()) {
        compileSdkVersion androidCompileSdkVersion.toInteger()
    } else {
        compileSdkVersion androidCompileSdkVersion
    }
    ndkVersion = androidNdkVersion

    buildToolsVersion androidBuildToolsVersion

    namespace = "org.subsurfacedivelog.mobile"

    defaultConfig {
        applicationId project.findProperty("subsurfaceApplicationId") ?: "org.subsurfacedivelog.mobile"
        minSdkVersion 28
        targetSdkVersion 35
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = [qtAndroidDir + '/src', 'src', 'java']
            aidl.srcDirs = [qtAndroidDir + '/src', 'src', 'aidl']
            res.srcDirs = [qtAndroidDir + '/res', 'res']
            resources.srcDirs = ['src']
            renderscript.srcDirs = ['src']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
       }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError = false
    }

    packaging {
        /* Exclude this as it is included in more than one dependency. */
        resources.excludes += 'META-INF/androidx/annotation/annotation/LICENSE.txt'
        /* Force native lib extraction to disk on install. AGP 8.x defaults to
           loading libs directly from the APK (useLegacyPackaging=false), but
           Qt 6's QtLoader cannot find native libraries on older Android versions
           (e.g. Android 11) when they are not extracted. */
        jniLibs.useLegacyPackaging = true
    }

    buildTypes {
        release {
            // The subsurfaceDebuggable property controls the android:debuggable
            // manifest flag WITHOUT switching to gradle's debug build variant
            // (which uses less aggressive ZIP compression, inflating the APK).
            debuggable subsurfaceDebugBuild

            // PR builds still use the release variant, so Gradle would otherwise
            // leave their APK unsigned. Use its automatically generated debug
            // key for these installable test artifacts only.
            if (subsurfaceDebugBuild) {
                signingConfig signingConfigs.debug
            }
        }
    }
}

// androiddeployqt --release assumes that Gradle produced an unsigned APK and
// unconditionally looks for the corresponding "-release-unsigned.apk" name.
// A signingConfig makes AGP omit that suffix. Mirror the debug-signed PR APK to
// the name expected by androiddeployqt so that it can copy the finished package.
if (subsurfaceDebugBuild) {
    tasks.matching { it.name == "assembleRelease" }.configureEach {
        doLast {
            def apkDirectory = project.layout.buildDirectory.dir("outputs/apk/release").get().asFile
            def signedApk = new File(apkDirectory, "${project.name}-release.apk")
            if (!signedApk.exists()) {
                throw new GradleException("Unable to locate debug-signed release APK at ${signedApk}")
            }
            def qtExpectedApk = new File(apkDirectory, "${project.name}-release-unsigned.apk")
            java.nio.file.Files.copy(signedApk.toPath(), qtExpectedApk.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
}
