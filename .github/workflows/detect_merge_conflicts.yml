name: "Detect Merge Conflicts"
on:
  # So that PRs touching the same files as the push are updated
  push:
  # Lets the workflow update labels and comments on fork PRs. `pull_request`
  # receives a read-only token for forks, so it cannot perform those updates.
  # Do not check out or execute pull-request code in this privileged workflow.
  pull_request_target:
    types: [synchronize]

permissions: read-all

jobs:
  main:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: check if pull requests have merge conflicts
        uses: eps1lon/actions-label-merge-conflict@0273be72a0bbd58fcd71d0d6c02c209b50d1e5e1 # v3.1.0
        with:
          dirtyLabel: "rebase-required"
          removeOnDirtyLabel: "rebased"
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          commentOnDirty: "This pull request has merge conflicts, please resolve them in order to make this pull request ready for review / merge."
          commentOnClean: "Thank you for resolving the merge conflicts."
