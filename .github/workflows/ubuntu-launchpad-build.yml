name: Ubuntu Launchpad Build

concurrency:
  group: launchpad-ppa-upload
  cancel-in-progress: true

on:
  push:
    paths-ignore:
    - scripts/docker/**
    branches:
    - master
    - current

permissions: read-all

jobs:
  push-to-ppa:

    name: Submit build to Ubuntu Launchpad
    runs-on: ubuntu-latest

    steps:
    - name: Check out sources
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: recursive

    - name: set the version information
      id: version_number
      uses: ./.github/actions/manage-version
      with:
        nightly-builds-secret: ${{ secrets.NIGHTLY_BUILDS }}

    - name: Setup build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y devscripts dput gpg debhelper qt5-qmake cmake

    - name: Setup gpg key token for launchpad
      env:
        GPG_PRIVATE_KEY: ${{ secrets.PPA_SECRET_KEY }}
      run: |
        echo "$GPG_PRIVATE_KEY" > ~/.key
        gpg --import ~/.key

    - name: setup git
      run: |
        git config --global --add safe.directory /__w/subsurface/subsurface
        git config --global --add safe.directory /__w/subsurface/subsurface/libdivecomputer

    - name: Checkout googlemaps
      run: |
        cd ..
        git clone https://github.com/subsurface/googlemaps

    - name: Checkout qlitehtml
      # QLiteHtml provides printing and user manual support for the Qt6 (Ubuntu 26.04
      # and newer) packages. Use the version that the other builds use, as pinned in
      # scripts/get-dep-lib.sh. It bundles litehtml as a submodule, hence --recursive.
      run: |
        QLITEHTML_REV=$(sed -n 's/^CURRENT_QLITEHTML="\(.*\)"/\1/p' scripts/get-dep-lib.sh)
        cd ..
        git clone --recursive https://github.com/dirkhh/qlitehtml
        cd qlitehtml
        git checkout -f "$QLITEHTML_REV"
        git submodule update --init --recursive

    - name: run the launchpad make-package script
      run: |
        cd ..
        bash -x subsurface/packaging/ubuntu/make-package.sh $GITHUB_REF_NAME

